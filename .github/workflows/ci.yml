name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: tricity_writer_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
    env:
      # Integration suites in db, core and api run against this; they are skipped when it is unset.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tricity_writer_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  connector:
    name: Connector e2e (PHP ${{ matrix.php }}${{ matrix.seo && format(', {0}', matrix.seo) || '' }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: "7.4"
          - php: "8.3"
            seo: yoast
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @tricity/core e2e:connector --php=${{ matrix.php }} ${{ matrix.seo && format('--seo={0}', matrix.seo) || '' }}

  images:
    name: Docker images
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the server image (api, worker, migrate)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: server
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the dashboard image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: false
          build-args: API_INTERNAL_URL=http://api:4000
          cache-from: type=gha
          cache-to: type=gha,mode=max
